<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line follow - RACECAR Neo</title>
<!-- RACECAR Neo V2 styles from labs/web/ (racecar_neo_ros2_driver scripts/web/):
     tokens and rcn-* components in rcn.css, time charts in charts.js. The
     reference page for this standard is wallfollow_dashboard/wallfollow.html.
     battery.js, lost.js and override.js are left out: they talk to the car's
     8080 home page, which the simulator lacks. -->
<link rel="stylesheet" href="/ui/rcn.css?v=13">
<link rel="icon" href="/ui/brand/app-icon-32.png">
<script src="/ui/charts.js?v=13"></script>
<style>
  .rcn-header .heading { display: flex; flex-direction: column; min-width: 0; }
  .rcn-header .meta { font: 600 13px/18px var(--rcn-font-sans); color: var(--rcn-text-muted); }
  .rcn-header .meta b { color: var(--rcn-text); font-variant-numeric: tabular-nums; }
  main { max-width: 1800px; margin: 0 auto; padding: var(--rcn-space-4); display: grid; gap: var(--rcn-space-4); }
  /* 592 = 560 + the card's 16 px padding either side, so a view inside one of
     these columns lands at 560 px, the width the sibling dashboards cap their
     camera at. Row 1: color view, mask view, then the state box and its
     offset trace over the rest of the width. Row 2 is the tune panel. */
  .grid { display: grid; grid-template-columns: 592px 592px minmax(0, 1fr); gap: var(--rcn-space-4); }
  @media (max-width: 1400px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--rcn-surface); border-radius: var(--rcn-radius-md); padding: var(--rcn-space-4); min-width: 0; }
  .card h2 { font-size: 20px; line-height: 28px; margin-bottom: var(--rcn-space-3); }
  .card h3 { font: 600 14px/20px var(--rcn-font-sans); margin-top: var(--rcn-space-4); padding-bottom: var(--rcn-space-1); border-bottom: 1px solid var(--rcn-border); }
  .caption { font: 600 13px/18px var(--rcn-font-sans); color: var(--rcn-text-muted); margin-top: var(--rcn-space-2); }
  .view { background: var(--rcn-code-bg); border-radius: var(--rcn-radius-sm); width: 100%; max-width: 560px; height: auto; display: block; aspect-ratio: 4 / 3; object-fit: contain; }
  label { display: block; color: var(--rcn-text-muted); font-size: 14px; line-height: 20px; font-weight: 600; margin-top: var(--rcn-space-3); }
  label b { color: var(--rcn-text); font-variant-numeric: tabular-nums; }
  input[type=number].rcn-input { width: 7rem; padding: 4px 8px; margin-left: var(--rcn-space-2); }
  input[type=range] { width: 100%; }
  select.rcn-input { max-width: 220px; }
  .tools { display: flex; flex-wrap: wrap; gap: var(--rcn-space-2); align-items: center; margin-top: var(--rcn-space-4); }
  .rcn-chart { height: 200px; }
  .rcn-legend { margin-top: var(--rcn-space-2); }
  /* Whether the line is in the band, the one thing readable from across the room. */
  .state { font: 800 italic 25px/32px var(--rcn-font-display); text-transform: uppercase; letter-spacing: 0.02em;
           color: var(--rcn-paper); background: var(--rcn-success); border-radius: var(--rcn-radius-md);
           padding: var(--rcn-space-4) var(--rcn-space-2); text-align: center; }
  .state.lost { background: var(--rcn-crimson); }
  /* The four trackbar groups sit in a row so the full-width tune card stays
     short; each group keeps its own order top to bottom. */
  .tunecols { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0 var(--rcn-space-6); }
  @media (max-width: 1100px) { .tunecols { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 600px) { .tunecols { grid-template-columns: 1fr; } }
  /* A two-thumb range: two native sliders stacked on one track. The track
     of each is invisible and ignores the pointer; only the thumbs catch it,
     so both can be dragged wherever they sit. The fill between them is a
     div underneath. */
  .dual { position: relative; height: 28px; margin-top: var(--rcn-space-1); color: var(--rcn-accent); }
  .dual .track { position: absolute; left: 0; right: 0; top: 11px; height: 6px; border-radius: 3px; background: var(--rcn-steel); }
  .dual .track.hue { background: linear-gradient(to right, #f00 0%, #ff0 17%, #0f0 33%, #0ff 50%, #00f 67%, #f0f 83%, #f00 100%); }
  .dual .fill { position: absolute; top: 11px; height: 6px; background: currentColor; border-radius: 3px; pointer-events: none; }
  .dual .track.hue + .fill { color: rgba(35, 31, 32, 0.45); border: 1px solid var(--rcn-paper); top: 10px; height: 8px; }
  .dual input[type=range] { position: absolute; left: 0; right: 0; top: 0; width: 100%; height: 28px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; pointer-events: none; }
  .dual input[type=range]::-webkit-slider-runnable-track { background: transparent; height: 28px; }
  .dual input[type=range]::-moz-range-track { background: transparent; height: 28px; }
  .dual input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; pointer-events: auto; width: 16px; height: 16px; margin-top: 6px; border-radius: 50%; background: var(--rcn-paper); border: 2px solid var(--rcn-accent); cursor: pointer; }
  .dual input[type=range]::-moz-range-thumb { pointer-events: auto; width: 12px; height: 12px; border-radius: 50%; background: var(--rcn-paper); border: 2px solid var(--rcn-accent); cursor: pointer; }
  #toast { position: fixed; left: 50%; bottom: var(--rcn-space-6); transform: translateX(-50%); padding: var(--rcn-space-2) var(--rcn-space-4); border-radius: var(--rcn-radius-md); background: var(--rcn-ink); border: 1px solid var(--rcn-steel); font-weight: 600; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header class="rcn-header">
  <img class="rcn-mark" src="/ui/brand/mark.png" alt="RACECAR Neo">
  <div class="heading">
    <span class="rcn-title">Line follow</span>
    <span class="meta">line <b id="mode">-</b> &middot; offset <b id="err">-</b> &middot; steer <b id="steer">-</b>
      &middot; throttle <b id="thr">-</b> &middot; encoder <b id="enc">-</b> m/s
      &middot; camera <b id="fps">-</b> fps &middot; processed <b id="pfps">-</b> fps &middot; frame <b id="res">-</b></span>
  </div>
  <span class="rcn-spacer"></span>
  <button class="rcn-btn quiet small" onclick="reset()" title="Re-read linefollow.yaml.">Reset</button>
  <button class="rcn-btn danger small" onclick="stopCar()" title="Set speed to 0.">Stop</button>
</header>

<main>
<div class="grid">
  <div class="card">
    <h2>Camera</h2>
    <img id="color" class="view" alt="color view" title="Gold box: crop band. Orange: largest contour and its center. Gray: setpoint.">
  </div>
  <div class="card">
    <h2>Mask</h2>
    <img id="mask" class="view" alt="mask view" title="White: inside the HSV range. Only the gold band is searched for the line.">
  </div>
  <div class="card">
    <h2>State</h2>
    <div class="state" id="state"></div>
    <h3>Line offset vs setpoint (live)</h3>
    <div class="rcn-chart" id="chart" title="-1 is the left edge of the frame, +1 the right. A flat trace at 0 is a stable follower; a growing zigzag is too much angle_kp or too little angle_kd."></div>
    <div class="rcn-legend" id="chartLegend"></div>
  </div>
</div>

<div class="card">
  <h2>Tune</h2>
  <div class="tunecols">
    <div>
      <h3 title="Hue 0..179, saturation and value 0..255. Drag the two thumbs of each bar. A hue low above its high wraps through 0, which is how red is selected.">1. HSV threshold</h3>
      <div id="hsvform"></div>
    </div>
    <div>
      <h3 title="Constant throttle and the proportional steering gain.">2. Speed and angle</h3>
      <div id="driveform"></div>
    </div>
    <div>
      <h3 title="Fractions of the frame from the top. Move both edges together to look higher or lower; spread them to take in more floor.">3. Crop band</h3>
      <div id="cropform"></div>
      <label title="Smallest contour, in pixels, that counts as the line. Raise it to ignore specks.">min_area
        <input id="in_min_area" class="rcn-input" type="number" step="1" min="1" onchange="post('/params', {min_area: parseInt(this.value)})"></label>
    </div>
    <div>
      <h3 title="speed_kp slows the car as the line drifts from center; angle_kd damps the steering on the change in offset; max_speed scales the throttle the car is sent.">4. Proportional speed and derivative angle</h3>
      <div id="pdform"></div>
    </div>
  </div>
  <div class="tools">
    <button class="rcn-btn primary small" onclick="saveTune()">Save</button>
    <button class="rcn-btn quiet small" onclick="loadTune()">Load</button>
  </div>
</div>

<div class="card">
  <h2>Logs</h2>
  <div class="tools" style="margin-top: 0">
    <button class="rcn-btn quiet small" onclick="saveLog()">Save log</button>
    <select class="rcn-input" id="logsel" aria-label="Log file"></select>
    <button class="rcn-btn quiet small" onclick="loadLog()">Load log</button>
    <span class="caption" id="loginfo" style="margin-top: 0"></span>
  </div>
  <div class="rcn-chart" id="logChart" style="margin-top: var(--rcn-space-3)"></div>
  <div class="rcn-legend" id="logLegend"></div>
</div>
</main>
<div id="toast" role="status"></div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const { timeChart, legendHtml, recentTicks, niceTicks } = RcnCharts;
// Single-thumb trackbars, in the order each group shows them.
const SLIDERS = {
  driveform: [
    { key: 'speed', label: 'speed', tip: '0 to 1 throttle', min: 0, max: 1, step: 0.01 },
    { key: 'angle_kp', label: 'angle_kp', tip: 'steer per unit offset', min: 0, max: 4, step: 0.01 },
  ],
  cropform: [
    { key: 'crop_top', label: 'crop_top', tip: 'top edge, 0 to 1 of the frame from the top', min: 0, max: 1, step: 0.01 },
    { key: 'crop_bottom', label: 'crop_bottom', tip: 'bottom edge, 0 to 1 of the frame from the top', min: 0, max: 1, step: 0.01 },
  ],
  pdform: [
    { key: 'speed_kp', label: 'speed_kp', tip: 'throttle drop per unit |offset|; 0 = constant speed', min: 0, max: 1, step: 0.01 },
    { key: 'angle_kd', label: 'angle_kd', tip: 'damper on the change in offset', min: 0, max: 2, step: 0.01 },
    { key: 'max_speed', label: 'max_speed', tip: '0 to 1; rc.drive.set_max_speed, scales every throttle', min: 0, max: 1, step: 0.01 },
  ],
};
// Two-thumb bars: one per HSV channel.
const DUALS = [
  { lo: 'h_low', hi: 'h_high', label: 'hue', tip: '0 to 179; low above high wraps through 0 for red', max: 179, cls: 'hue' },
  { lo: 's_low', hi: 's_high', label: 'saturation', tip: '0 to 255; raise the low to drop grey and white', max: 255, cls: '' },
  { lo: 'v_low', hi: 'v_high', label: 'value', tip: '0 to 255; raise the low to drop shadow, lower the high to drop glare', max: 255, cls: '' },
];

let last = null;

function post(path, body) { return fetch(path, { method: 'POST', body: body ? JSON.stringify(body) : null }); }
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// A trackbar fires on every pixel of a drag. Send at most one update per
// SEND_MS and always the newest value, so the car tracks the thumb without
// flooding the service.
const SEND_MS = 60;
let pending = {}, sendTimer = null;
function queue(key, value) {
  pending[key] = value;
  if (sendTimer) return;
  sendTimer = setTimeout(() => {
    const body = pending; pending = {}; sendTimer = null;
    post('/params', body);
  }, SEND_MS);
}

// Re-read the yaml and rebuild every trackbar.
function reset() { post('/load').then(() => { $('hsvform').dataset.built = ''; }); }
function stopCar() { post('/params', { speed: 0 }).then(() => { $('hsvform').dataset.built = ''; }); }
function saveTune() { post('/save').then(() => toast('Saved.')); }
function loadTune() { post('/load').then(() => { $('hsvform').dataset.built = ''; toast('Loaded.'); }); }

function showVal(key, v) {
  const el = $(`val_${key}`);
  if (el) el.textContent = v;
}

function setFill(d) {
  const lo = parseInt($(`in_${d.lo}`).value);
  const hi = parseInt($(`in_${d.hi}`).value);
  const fill = $(`fill_${d.lo}`);
  if (lo <= hi) {
    fill.style.left = `${lo / d.max * 100}%`;
    fill.style.width = `${(hi - lo) / d.max * 100}%`;
    fill.style.background = '';
  } else {
    // Wrapped: fill the outside of the two thumbs by drawing the gap as a
    // hole. Shown as the full track with the excluded middle left grey.
    fill.style.left = '0%'; fill.style.width = '100%';
    fill.style.background = `linear-gradient(to right, currentColor ${hi / d.max * 100}%, transparent ${hi / d.max * 100}%, transparent ${lo / d.max * 100}%, currentColor ${lo / d.max * 100}%)`;
  }
  $(`val_${d.lo}`).textContent = `${lo} to ${hi}${lo > hi ? ' (wraps)' : ''}`;
}

function buildForm(p) {
  // Rebuild only on Reset/Load/Stop so a drag is not interrupted by polling.
  const anchor = $('hsvform');
  if (anchor.dataset.built) return;
  anchor.dataset.built = '1';
  anchor.innerHTML = DUALS.map(d => `
    <label title="${d.tip}">${d.label} <b id="val_${d.lo}"></b></label>
    <div class="dual" title="${d.tip}">
      <div class="track ${d.cls}"></div>
      <div class="fill" id="fill_${d.lo}"></div>
      <input id="in_${d.lo}" type="range" min="0" max="${d.max}" step="1" value="${p[d.lo]}">
      <input id="in_${d.hi}" type="range" min="0" max="${d.max}" step="1" value="${p[d.hi]}">
    </div>`).join('');
  for (const d of DUALS) {
    for (const k of [d.lo, d.hi]) {
      $(`in_${k}`).oninput = e => { setFill(d); queue(k, parseInt(e.target.value)); };
    }
    setFill(d);
  }
  for (const [form, list] of Object.entries(SLIDERS)) {
    $(form).innerHTML = list.map(s => `
      <label title="${s.tip}">${s.label} <b id="val_${s.key}">${p[s.key]}</b>
        <input id="in_${s.key}" type="range" min="${s.min}" max="${s.max}" step="${s.step}" value="${p[s.key]}"></label>`).join('');
    for (const s of list) {
      $(`in_${s.key}`).oninput = e => {
        showVal(s.key, e.target.value);
        queue(s.key, parseFloat(e.target.value));
      };
    }
  }
  $('in_min_area').value = p.min_area;
}

// The service clamps what it is sent (band order, ranges), so after a drag
// the thumbs are pulled to what actually applied. Skipped for a thumb that
// is being held, so the drag itself is never fought.
function syncForm(p) {
  if (document.querySelector('input:active')) return;
  for (const list of Object.values(SLIDERS)) {
    for (const s of list) {
      const el = $(`in_${s.key}`);
      if (el && parseFloat(el.value) !== p[s.key]) { el.value = p[s.key]; showVal(s.key, p[s.key]); }
    }
  }
  for (const d of DUALS) {
    let moved = false;
    for (const k of [d.lo, d.hi]) {
      const el = $(`in_${k}`);
      if (el && parseInt(el.value) !== p[k]) { el.value = p[k]; moved = true; }
    }
    if (moved) setFill(d);
  }
}

// Pull frames one at a time so a congested link drops frame rate instead
// of building a lag queue. Pauses when the tab is hidden.
function liveLoop(id, path, period) {
  const img = $(id);
  (function tick() {
    if (document.hidden) { setTimeout(tick, 250); return; }
    const t = Date.now();
    const done = () => {
      img.removeEventListener('load', done); img.removeEventListener('error', done);
      setTimeout(tick, Math.max(20, period - (Date.now() - t)));
    };
    img.addEventListener('load', done); img.addEventListener('error', done);
    img.src = `${path}?${t}`;
  })();
}
liveLoop('color', '/frame/color', 120);
liveLoop('mask', '/frame/mask', 120);

const shown = new Map();
function setLegend(id, html) { if (shown.get(id) !== html) { shown.set(id, html); $(id).innerHTML = html; } }

let busy = false;
function update() {
  if (busy) return;  // do not stack requests if the network lags
  busy = true;
  fetch('/state').then(r => r.json()).then(d => {
    busy = false;
    last = d;
    $('mode').textContent = d.found ? 'found' : 'lost';
    $('err').textContent = d.error;
    $('steer').textContent = d.steer;
    $('thr').textContent = d.speed_cmd;
    $('enc').textContent = d.enc_speed;
    $('fps').textContent = d.cam_fps;
    $('pfps').textContent = d.proc_fps;
    $('res').textContent = d.res[0] ? `${d.res[0]}x${d.res[1]} -> ${d.proc_res[0]}x${d.proc_res[1]}` : 'none';

    const box = $('state');
    box.textContent = d.found ? 'Line found' : 'Line lost';
    box.className = 'state' + (d.found ? '' : ' lost');
    // What the box would have said in words is on hover instead.
    box.title = d.found
      ? `Center at column ${d.cx} of ${d.proc_res[0]}, row ${d.cy}; area ${d.area} px.`
      : `No contour of at least ${d.params.min_area} px in the band for `
        + `${d.lost_for === null ? 'the whole run' : d.lost_for + ' s'}; holding the last command.`;

    buildForm(d.params);
    syncForm(d.params);
    // The offset is already -1..1, so the axis is fixed rather than fit to
    // the data: a small wobble looks small.
    const hist = d.hist || [];
    const now = hist.length ? hist[hist.length - 1][0] : 0;
    const t0 = hist.length ? hist[0][0] : now - 1;
    timeChart($('chart'), t0, now,
      [{ name: 'Offset', style: 'a', axis: 'l', unit: '', digits: 2, minSpan: 0.1, pts: hist.map(r => [r[0], r[1]]) }],
      recentTicks(now, 10), { gapSec: 0.5, fixed: { l: [-1, 1] }, marks: d.marks, bands: hist.map(r => [r[0], r[2]]) });
    setLegend('chartLegend', legendHtml([{ name: 'Offset (-1 to 1), setpoint 0; red strip: line lost', style: 'a' }]));
  }).catch(() => { busy = false; });
}

const logTicks = (t0) => Object.assign((a, b) => {
  const step = niceTicks(0, b - a, 5)[1] || 1, out = [];
  for (let s = 0; s <= b - a + 1e-6; s += step) out.push([a + s, `${(a + s - t0).toFixed(0)} s`]);
  return out;
}, { label: (t) => `${(t - t0).toFixed(1)} s` });
function loadLog() {
  const f = $('logsel').value;
  if (!f) return;
  fetch('/logs/' + f).then(r => r.text()).then(txt => {
    const lines = txt.trim().split('\n');
    const marks = lines.filter(l => l.startsWith('# mark'))
      .map(l => { const p = l.split(','); return [parseFloat(p[1]), p.slice(2).join(',')]; });
    const rows = lines.filter(l => !l.startsWith('#')).slice(1).map(l => l.split(',').map(Number));
    const lostRows = rows.filter(r => r[5]).length;
    $('loginfo').textContent = `${f}: ${rows.length} frames, ${marks.length} changes, ${lostRows} with the line lost`;
    if (!rows.length) return;
    const t0 = rows[0][0], t1 = rows[rows.length - 1][0];
    timeChart($('logChart'), t0, t1, [
      { name: 'Offset', style: 'a', axis: 'l', unit: '', digits: 3, minSpan: 0.1, pts: rows.map(r => [r[0], r[1]]) },
      { name: 'Steer', style: 'b', axis: 'l', unit: '', digits: 3, minSpan: 0.1, pts: rows.map(r => [r[0], r[2]]) },
    ], logTicks(t0), { gapSec: 0.5, fixed: { l: [-1, 1] }, marks, bands: rows.map(r => [r[0], r[5]]) });
    setLegend('logLegend', legendHtml([{ name: 'Offset (-1 to 1)', style: 'a' }, { name: 'Steer (-1 to 1)', style: 'b' }]));
  });
}

// Snapshot what is on the live chart to a csv, then show it right away.
function saveLog() { post('/logs/save').then(() => { refreshLogs(true); toast('Log saved.'); }); }

function refreshLogs(loadLatest) {
  fetch('/logs').then(r => r.json()).then(names => {
    const sel = $('logsel');
    sel.innerHTML = names.map(n => `<option>${n}</option>`).join('');
    sel.selectedIndex = names.length - 1;  // Load defaults to the latest save
    if (loadLatest && names.length) loadLog();
  });
}

refreshLogs(false);

update();
setInterval(update, 120);  // frames are processed at 20 Hz; poll a little faster
</script>
</body>
</html>
