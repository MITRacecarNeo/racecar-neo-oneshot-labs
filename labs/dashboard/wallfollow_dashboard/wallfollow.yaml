# RACECAR Neo wall-follow parameters.
# Switch mode by editing this file, then press Reset or Load on the
# dashboard. There is no UI toggle for mode: the two controllers take
# different parameters and mean different things by "error".
# Save on the dashboard rewrites the numbers below in place.
mode: 1               # 0 = static, 1 = dynamic

speed: 0.0            # 0..1 throttle, scaled by max_speed below.
                      # Ships at 0.0 so nothing drives until you raise it.
kp: 0.5               # steering strength
kd: 4.0               # damper on the change in error between scans.
                      # Raise this if the car wobbles.
speed_kp: 0.0         # 0 = constant speed (slider only). Raise to pull the
                      # encoder speed toward the road-shaped target.
speed_kd: 0.0         # damper for that correction; only used when speed_kp > 0
max_speed: 0.25       # 0..1, passed to rc.drive.set_max_speed; every throttle
                      # is multiplied by it. 0.25 is the racecar_core default.
window: 10.0          # averaging window per ray, in degrees. Smooths noise.
max_mps: 4.0          # the car's top speed in m/s at full throttle and
                      # max_speed 1.0; only used when speed_kp or speed_kd > 0
lookahead: 3.0        # meters. Distances are capped here in both modes, so an
                      # open side reads as lookahead, not as 10 m of empty room.

# static mode: mirrored side windows, error = right - left (setpoint 0).
look_angle: 55.0      # side windows this many degrees off the nose. 90 is straight sideways.

# dynamic mode: steer toward the most open heading in a front arc.
width: 80.0           # search this many degrees left and right of the nose
side_weight: 0.0      # score bonus (m per degree) toward the right. Negative prefers left.
